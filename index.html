
<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101827">
  <meta name="description" content="Japan Connect - つながる、共有する。">
  <title>🇯🇵 Japan Connect</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="#" data-page="home">🇯🇵 <span>Japan Connect</span></a>
      <div class="top-actions">
        <button class="icon-btn" id="themeBtn" title="テーマ切替" aria-label="テーマ切替">☾</button>
        <button class="avatar small" id="headerAvatar" data-page="mypage" title="マイページ">?</button>
      </div>
    </header>
    <div class="layout">
      <aside class="sidebar">
        <button class="nav active" data-page="home">⌂ <span>ホーム</span></button>
        <button class="nav" data-page="channel">▣ <span>マイチャンネル</span></button>
        <button class="nav" data-page="mail">✉ <span>メール</span></button>
        <button class="nav" data-page="search">⌕ <span>検索</span></button>
        <button class="nav" data-page="friends">♧ <span>友達</span></button>
        <button class="nav" data-page="mypage">⚙ <span>マイページ・設定</span></button>
        <div class="sidebar-bottom"><small id="versionLabel">Japan Connect</small><button class="text-btn" data-page="login" id="loginNav">ログイン / 登録</button></div>
      </aside>
      <main id="main" class="main-content" aria-live="polite">
        <section class="hero">
          <p class="eyebrow">WELCOME TO</p><h1>Japan Connect 🇯🇵</h1>
          <p>好きなことを投稿して、みんなとつながろう。</p>
          <button class="primary" data-page="login">ログイン・アカウント作成</button>
        </section>
        <div class="section-heading"><h2>おすすめの投稿</h2><button class="secondary" data-page="search">投稿を探す</button></div>
        <div id="homePosts" class="post-list"><div class="empty">投稿を読み込んでいます…</div></div>
      </main>
    </div>
    <nav class="mobile-nav">
      <button class="active" data-page="home">⌂<small>ホーム</small></button>
      <button data-page="channel">▣<small>チャンネル</small></button>
      <button data-page="mail">✉<small>メール</small></button>
      <button data-page="search">⌕<small>検索</small></button>
      <button data-page="mypage">☻<small>マイページ</small></button>
    </nav>
  </div>
  <div id="toast" class="toast" role="status"></div>
  <script src="/app.js" defer></script>
</body>
</html>
